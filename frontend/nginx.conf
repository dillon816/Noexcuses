# Config nginx pour servir l'application React compilée (prod)
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Routing SPA : toutes les routes renvoient vers index.html
    # (React Router gère ensuite la navigation côté client)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long pour les fichiers statiques (js, css, images)
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
