name: CI — NoExcuses

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

jobs:
  # Backend : Symfony / PHPUnit
  backend:
    name: Backend (PHP 8.3 / Symfony 6.4)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ""
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: noexcuses_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: intl, pdo_mysql, zip, mbstring, opcache
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        env:
          COMPOSER_MEMORY_LIMIT: -1
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

      # Échoue si une dépendance PHP installée a une faille de sécurité connue
      - name: Audit PHP dependencies
        run: composer audit --locked --abandoned=report

      - name: Create .env for CI
        run: echo "APP_ENV=test" > .env

      - name: Generate JWT keys
        run: |
          mkdir -p config/jwt
          openssl genrsa -out config/jwt/private.pem 2048
          openssl rsa -pubout -in config/jwt/private.pem -out config/jwt/public.pem

      - name: Run migrations on test DB
        run: php bin/console doctrine:migrations:migrate --no-interaction --env=test

      - name: Run PHPUnit
        run: vendor/bin/phpunit --testdox

  # Frontend : React / Build
  frontend:
    name: Frontend (Node 20 / React)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # Échoue si une dépendance livrée en production a une faille élevée ou critique
      - name: Audit npm dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build
        env:
          REACT_APP_API_URL: http://localhost/api
          CI: false

  # Sécurité : analyse statique du code (SAST)
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Semgrep
        run: pipx install semgrep==1.180.0

      # Lit le code sans l'exécuter et échoue à la moindre alerte de sécurité
      - name: Run Semgrep
        run: >
          semgrep scan --error --metrics=off
          --config p/php --config p/javascript --config p/react
          --config p/secrets --config p/security-audit --config p/owasp-top-ten
          backend/src backend/config frontend/src
