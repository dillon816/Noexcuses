name: CI — NoExcuses

on:
  push:
    branches: [develop, "feature/**", "fix/**"]
  pull_request:
    branches: [develop, main]

jobs:
  # ── Backend : Symfony / PHPUnit ────────────────────────────────────────────
  backend:
    name: Backend (PHP 8.2 / Symfony 6.4)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: noexcuses_test
          MYSQL_USER: noexcuses
          MYSQL_PASSWORD: noexcuses
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: intl, pdo_mysql, zip, mbstring, opcache
          coverage: xdebug

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Copy env
        run: cp .env.example .env.test.local

      - name: Run PHPUnit
        env:
          APP_ENV: test
          DATABASE_URL: "mysql://noexcuses:noexcuses@127.0.0.1:3306/noexcuses_test?serverVersion=8.0"
        run: vendor/bin/phpunit --coverage-text

  # ── Frontend : React / ESLint / Build ─────────────────────────────────────
  frontend:
    name: Frontend (Node 20 / React)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build
        env:
          REACT_APP_API_URL: http://localhost/api
          CI: false
