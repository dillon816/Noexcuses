# docker-compose.yml : orchestre les 4 conteneurs de NoExcuses
# Lancement de toute l'application en une commande : docker compose up

services:

  # MySQL 8 : la base de données
  mysql:
    image: mysql:8.0                      # image officielle MySQL, rien à construire
    container_name: noexcuses_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-noexcuses}
      MYSQL_USER: ${MYSQL_USER:-noexcuses}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-noexcuses}
    ports:
      - "3306:3306"                       # accès depuis ta machine (port hôte:conteneur)
    volumes:
      - mysql_data:/var/lib/mysql         # persiste les données même si le conteneur est supprimé
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro  # scripts SQL d'init (dump éventuel)
    healthcheck:                          # nginx/symfony attendent que ce test passe
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - noexcuses_net

  # phpMyAdmin : interface web pour visualiser la base (outil d'admin)
  phpmyadmin:
    image: phpmyadmin:5.2              # image officielle, rien à construire
    container_name: noexcuses_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"                      # accessible sur http://localhost:8081
    environment:
      PMA_HOST: mysql                  # se connecte au conteneur "mysql" (réseau Docker)
      PMA_PORT: 3306
    depends_on:
      - mysql
    networks:
      - noexcuses_net

  # Symfony (PHP-FPM) : le backend / API
  symfony:
    build:                                # construit l'image depuis notre Dockerfile
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: noexcuses_symfony
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html           # monte le code : modif locale = reflétée dans le conteneur
      # vendor/ et var/ dans des volumes Docker natifs (pas le montage Windows) :
      # gros gain de perf car ce sont les dossiers les plus lus par Symfony
      - vendor_data:/var/www/html/vendor
      - var_data:/var/www/html/var
    depends_on:
      mysql:
        condition: service_healthy        # ne démarre qu'une fois MySQL prêt
    environment:
      APP_ENV: dev
      # Xdebug desactive par defaut (gros gain de perf). Le mettre a "coverage"
      # uniquement quand on veut generer la couverture de tests.
      XDEBUG_MODE: "off"
      APP_SECRET: noexcuses_secret_dev_key_32chars_ok
      # IMPORTANT : l'hôte de la BDD est "mysql" (nom du conteneur), pas 127.0.0.1
      DATABASE_URL: "mysql://noexcuses:noexcuses@mysql:3306/noexcuses?serverVersion=8.0&charset=utf8mb4"
      # Chemins absolus résolus par Symfony (%kernel.project_dir% = /var/www/html)
      # Un chemin relatif échouerait en requête web car php-fpm tourne depuis public/
      JWT_SECRET_KEY: "%kernel.project_dir%/config/jwt/private.pem"
      JWT_PUBLIC_KEY: "%kernel.project_dir%/config/jwt/public.pem"
      JWT_PASSPHRASE: noexcuses
      JWT_TTL: 3600
      CORS_ALLOW_ORIGIN: "^https?://(localhost|127\\.0\\.0\\.1)(:[0-9]+)?$"
      # Clés API lues depuis le fichier .env à la racine (non versionné)
      CALORIENINJAS_API_KEY: ${CALORIENINJAS_API_KEY:-changeme}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-changeme}
      # Client ID Google (connexion OAuth) : lu depuis le .env a la racine
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-changeme}
    networks:
      - noexcuses_net

  # Nginx : le reverse proxy (point d'entrée HTTP du backend)
  nginx:
    image: nginx:1.27-alpine
    container_name: noexcuses_nginx
    restart: unless-stopped
    ports:
      - "8000:80"                         # l'API sera accessible sur http://localhost:8000
    volumes:
      - ./backend:/var/www/html:ro        # nginx lit le dossier public/ (lecture seule)
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - symfony
    networks:
      - noexcuses_net

  # React : le frontend
  react:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: noexcuses_react
    restart: unless-stopped
    ports:
      - "3000:3000"                       # interface accessible sur http://localhost:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules                 # garde les node_modules du conteneur (pas ceux de l'hôte)
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api
      # Meme Client ID Google cote frontend (public) pour afficher le bouton de connexion
      - REACT_APP_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-changeme}
      - CHOKIDAR_USEPOLLING=true          # nécessaire pour le hot-reload dans Docker
    depends_on:
      - nginx
    networks:
      - noexcuses_net

# Volumes nommés : données MySQL + dépendances/cache backend (perf)
volumes:
  mysql_data:
    driver: local
  vendor_data:
    driver: local
  var_data:
    driver: local

# Réseau privé : les conteneurs se parlent par leur nom (mysql, symfony...)
networks:
  noexcuses_net:
    driver: bridge
