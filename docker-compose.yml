version: '3.8'

services:

  # ── PHP-FPM (Symfony) ───────────────────────────────────────────────────────
  symfony:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: noexcuses_symfony
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - backend/.env.local
    networks:
      - noexcuses_net

  # ── Nginx (reverse proxy) ───────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: noexcuses_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - symfony
    networks:
      - noexcuses_net

  # ── MySQL 8 ─────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: noexcuses_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-noexcuses}
      MYSQL_USER: ${MYSQL_USER:-noexcuses}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-noexcuses}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - noexcuses_net

  # ── React (dev server) ──────────────────────────────────────────────────────
  react:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: noexcuses_react
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=http://localhost/api
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - nginx
    networks:
      - noexcuses_net

volumes:
  mysql_data:
    driver: local

networks:
  noexcuses_net:
    driver: bridge
