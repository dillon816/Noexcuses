memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 20M
max_execution_time = 30
date.timezone = Europe/Paris

[opcache]
opcache.enable = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
; On ne verifie pas les timestamps a chaque requete : gros gain de perf sur un
; montage de volume Windows. Contrepartie : un changement de code PHP necessite
; un "docker compose restart symfony" pour etre pris en compte.
opcache.validate_timestamps = 0

[xdebug]
; Xdebug desactive par defaut (perf). Le reactiver via XDEBUG_MODE=coverage
; uniquement pour generer la couverture de tests.
xdebug.mode = off
xdebug.start_with_request = no
